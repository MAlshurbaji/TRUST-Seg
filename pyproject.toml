[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-seg"
version = "0.1.0"
description = "TRUST-Seg: uncertainty-aware weakly supervised 3D brain lesion segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "SimpleITK>=2.3,<3",
  "Pillow>=10,<12",
  "scipy>=1.12,<2",
  "MedPy>=0.5,<1",
  "tqdm>=4.66,<5",
  "torch>=2.6,<2.7",
]

[project.optional-dependencies]
preprocessing = [
  "nibabel>=5.2,<6",
  "opencv-python-headless>=4.9,<5",
  "scikit-image>=0.22,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["trustseg*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

