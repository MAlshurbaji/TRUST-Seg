dataset:
  name: isles22
  modality: DWI
  train_volumes: data/ISLES_128/3D_volumes/train_00_NIFTI
  validation_volumes: data/ISLES_128/3D_volumes/val_00_NIFTI
  test_volumes: data/ISLES_128/3D_volumes/test_00_NIFTI

paths:
  initial_pseudo_labels: data/ISLES_128/ensemble_masks_3D/pix0/alpha1/train_00
  refined_pseudo_labels: data/ISLES_128/ensemble_masks_3D/pix0/trustseg_refined/train_00
  runs: runs/isles22

teachers:
  sam_large:
    path: data/ISLES_128/sam_masks/vit_l/volumes_train_000
    reliability: 0.776
  medsam2_base:
    path: data/ISLES_128/medsam2_masks_3D/pix0/train_00_2411
    reliability: 0.709
  grabcut:
    path: data/ISLES_128/grabcut_masks/volumes_train_000
    reliability: 0.654

model:
  image_channels: 1
  with_bbox: true
  supervised_with_bbox: true
  base_channels: 16
  dropout: 0.3

training:
  seed: 2024
  device: cuda
  workers: 4
  batch_size: 1
  learning_rate: 0.0001
  initial_epochs: 200
  final_epochs: 200
  supervised_epochs: 200
  padding_factor: 16
  threshold: 0.5

ensemble:
  alpha_conf: 1.0

refinement:
  uncertainty_weight: 0.7
  student_threshold: 0.3
  confidence_threshold: 0.0
  attention_steepness: 8.0
