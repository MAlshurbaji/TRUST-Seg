dataset:
  name: brats19
  modality: FLAIR
  train_volumes: data/BraTS2019/3D_volumes/train_00_NIFTI
  validation_volumes: data/BraTS2019/3D_volumes/val_00_NIFTI
  test_volumes: data/BraTS2019/3D_volumes/test_00_NIFTI

paths:
  initial_pseudo_labels: data/BraTS2019/ensemble_masks_3D/pix0/alpha1/train_00
  refined_pseudo_labels: data/BraTS2019/ensemble_masks_3D/pix0/trustseg_refined/train_00
  runs: runs/brats19

teachers:
  medsam2_ct:
    path: data/BraTS2019/medsam2_masks_3D/pix0/train_00_CTLesion
    reliability: 0.870
  sam2_small:
    path: data/BraTS2019/sam2_masks_3D/pix0/train_00_s
    reliability: 0.837
  grabcut:
    path: data/BraTS2019/grabcut_masks/volumes_train_000
    reliability: 0.688

model:
  image_channels: 1
  with_bbox: true
  supervised_with_bbox: true
  base_channels: 16
  dropout: 0.3

training:
  seed: 2024
  device: cuda
  workers: 4
  batch_size: 1
  learning_rate: 0.0001
  initial_epochs: 200
  final_epochs: 200
  supervised_epochs: 200
  padding_factor: 16
  threshold: 0.5

ensemble:
  alpha_conf: 1.0

refinement:
  uncertainty_weight: 0.3
  student_threshold: 0.3
  confidence_threshold: 0.5
  attention_steepness: 7.0
